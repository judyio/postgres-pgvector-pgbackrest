name: PostgreSQL image

on:
  pull_request:
    paths:
      - Dockerfile
      - test-image
      - README.md
      - .github/workflows/postgres-image.yml
  push:
    tags:
      - postgres-v*

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and check both platforms
        run: |
          for platform in amd64 arm64; do
            docker buildx build --platform "linux/$platform" --load \
              -t "postgres-check:$platform" .
            ./test-image "postgres-check:$platform"
          done
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked images and index
        if: github.ref_type == 'tag'
        env:
          IMAGE: ghcr.io/judyio/postgres-pgvector-pgbackrest
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for platform in amd64 arm64; do
            docker tag "postgres-check:$platform" "$IMAGE:$RELEASE_TAG-$platform"
            docker push "$IMAGE:$RELEASE_TAG-$platform"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_TAG" \
            "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
